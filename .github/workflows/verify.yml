name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify through the canonical Docker environment
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Remove verification containers and volumes
        if: always()
        shell: pwsh
        run: docker compose -f compose.codex.yml down --volumes --remove-orphans

  ipc-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fuzz the IPC frame decoder through the canonical Docker environment
        shell: pwsh
        run: |
          docker compose -f compose.codex.yml up -d go-runner
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
          docker compose -f compose.codex.yml exec -T go-runner go test -run '^$' -fuzz '^FuzzDecodeFrameClosedUnion$' -fuzztime=30s -parallel=1 ./internal/ipc
          exit $LASTEXITCODE

      - name: Remove IPC fuzz containers and volumes
        if: always()
        shell: pwsh
        run: docker compose -f compose.codex.yml down --volumes --remove-orphans
