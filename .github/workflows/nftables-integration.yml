name: nftables integration

on:
  push:
    paths:
      - ".github/workflows/nftables-integration.yml"
      - "internal/firewall/**"

      - "internal/enforcer/**"
      - "internal/ipc/**"
      - "cmd/**"
      - "tests/integration/nftables/**"
      - "go.mod"
      - "go.sum"
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nftables:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the disposable nftables test image
        run: >-
          docker build
          --file tests/integration/nftables/Dockerfile
          --tag guard-wall-nftables-integration:${{ github.sha }}
          .

      - name: Run in an isolated network namespace
        run: >-
          docker run --rm
          --network none
          --cap-drop ALL
          --cap-add NET_ADMIN
          --cap-add NET_RAW
          --cap-add SYS_ADMIN
          --cap-add SETUID
          --cap-add SETGID
          --cap-add CHOWN
          --read-only
          --tmpfs /run:rw,nosuid,nodev,noexec,size=16m
          --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g
          --security-opt no-new-privileges:true
          --security-opt seccomp=unconfined
          guard-wall-nftables-integration:${{ github.sha }}

      - name: Remove the disposable test image
        if: always()
        run: docker image rm --force guard-wall-nftables-integration:${{ github.sha }} || true
